<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개인정보처리방침 · TT Studio Korea</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0e0a1a;
    color: #e8e0f4;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .wrap { max-width: 560px; width: 100%; }
  h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 8px; color: #fff; }
  .sub { font-size: 0.85rem; color: rgba(232,224,244,0.5); margin-bottom: 40px; }
  .card {
    display: flex; align-items: center; gap: 16px;
    padding: 20px;
    background: #17102a;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    margin-bottom: 12px;
    transition: border-color 0.2s, background 0.2s;
  }
  .card:hover { border-color: rgba(103,80,164,0.5); background: #1d1538; }
  .icon {
    width: 48px; height: 48px; border-radius: 12px;
    background: linear-gradient(135deg, #b5854a, #c9965a);
    display: grid; place-items: center;
    font-size: 22px; flex-shrink: 0;
  }
  .card-title { font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 3px; }
  .card-sub { font-size: 0.8rem; color: rgba(232,224,244,0.5); }
  footer { margin-top: 40px; font-size: 0.75rem; color: rgba(232,224,244,0.3); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>개인정보처리방침</h1>
  <p class="sub">TT Studio Korea — Privacy Policies</p>


  <footer>© 2026 TT Studio Korea</footer>
</div>
</body>
</html>
